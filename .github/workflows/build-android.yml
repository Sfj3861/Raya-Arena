name: Build Geode Android mod

on:
  push:
    branches: [main, nova-menu-initial]
  pull_request:
  workflow_dispatch:

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          path: ./

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: raya-arena-android64
          path: "**/*.geode"
          if-no-files-found: error
